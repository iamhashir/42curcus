services:
  nginx:
    build: ./requirements/nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always
  wordpress:
    build: ./requirements/wordpress
    env_file:
      - .env
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always
  mariadb:
      build: ./requirements/mariadb
      env_file:
        - .env
      volumes:
        - mariadb_data:/var/lib/mysql
      networks:
        - inception
      restart: always

networks:
  inception:
    driver: bridge
volumes:
  mariadb_data:
  wordpress_data:
